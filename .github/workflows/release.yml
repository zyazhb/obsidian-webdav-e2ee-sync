name: Release

# Pushing a tag such as 0.1.0 or v0.1.0 builds the plugin and publishes a GitHub Release.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check tag matches manifest.json / package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST="$(bun -e "console.log(require('./manifest.json').version)")"
          PKG="$(bun -e "console.log(require('./package.json').version)")"
          echo "tag=$TAG manifest=$MANIFEST package=$PKG"
          if [ "$TAG" != "$MANIFEST" ] || [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag ($TAG) must equal the version in manifest.json ($MANIFEST) and package.json ($PKG)."
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" --generate-notes $PRE
