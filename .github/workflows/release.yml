name: Release

# Pushing a tag such as 0.1.0 or v0.1.0 builds the plugin and publishes a GitHub Release.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check tag matches manifest.json / package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST="$(node -p "require('./manifest.json').version")"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG manifest=$MANIFEST package=$PKG"
          if [ "$TAG" != "$MANIFEST" ] || [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag ($TAG) must equal the version in manifest.json ($MANIFEST) and package.json ($PKG)."
            exit 1
          fi

      - run: npm install
      - run: npm test
      - run: npm run build

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" --generate-notes $PRE
